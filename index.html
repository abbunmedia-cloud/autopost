<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Posting Otomatis</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #2c3e50; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .header h1 { margin: 0; font-size: 24px; }
    .header .tanggal { text-align: right; font-size: 13px; color: #7f8c8d; }
    .header .tanggal .jam { font-size: 22px; font-weight: bold; color: #2c3e50; }
    .refresh-info { font-size: 12px; color: #95a5a6; margin-bottom: 14px; }
    .panel { background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .status-panel { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.aktif { background: #2ecc71; }
    .dot.nonaktif { background: #e74c3c; }
    .info-panel p { margin: 4px 0; font-size: 14px; }
    .info-panel .highlight { color: #2980b9; font-weight: 600; }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 140px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card h2 { margin: 0; font-size: 26px; }
    .card p { margin: 4px 0 0; font-size: 13px; color: #7f8c8d; }
    .main-content { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .table-wrap { flex: 3; min-width: 320px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #ecf0f1; }
    th { background: #2c3e50; color: #fff; }
    tr:hover { background: #f9fbfd; }
    a.link-posted { color: #27ae60; font-weight: 600; text-decoration: underline; }
    .status-error { color: #e74c3c; font-weight: 600; }
    .status-pending { color: #7f8c8d; }
    .schedule-panel { flex: 1.2; min-width: 260px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-height: 480px; overflow-y: auto; padding: 12px 16px; }
    .schedule-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f1f1f1; font-size: 13px; gap: 8px; }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-item .waktu { font-weight: 600; color: #2c3e50; white-space: nowrap; }
    .schedule-item .cek { color: #2ecc71; font-weight: bold; }
    .schedule-item .jam-icon { color: #f39c12; font-weight: bold; }
    .refresh-btn { padding: 8px 16px; background: #2c3e50; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 10px; }
    .refresh-btn:hover { background: #34495e; }
    .loading { text-align: center; color: #7f8c8d; margin: 16px 0; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Dashboard Posting Otomatis</h1>
    <div class="tanggal">
      <div id="tanggalHijriMasehi"></div>
      <div class="jam" id="jamSekarang"></div>
    </div>
  </div>

  <button class="refresh-btn" onclick="muatData()">🔄 Perbarui Sekarang</button>
  <div class="refresh-info">Memperbarui data otomatis setiap 15 detik</div>
  <div class="loading" id="loading">Memuat data...</div>

  <div class="panel status-panel">
    <span class="dot" id="statusDot"></span>
    <span id="statusTeks">Memuat status sistem...</span>
  </div>

  <div class="panel info-panel">
    <p>Terakhir diperbarui: <strong id="waktuUpdate">-</strong></p>
    <p>Posting berikutnya: <span class="highlight" id="jadwalBerikutnya">-</span> <span id="countdown"></span></p>
  </div>

  <div class="cards" id="cards"></div>

  <div class="main-content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Judul</th>
            <th>Lokasi</th>
            <th>Jadwal</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabelBody"></tbody>
      </table>
    </div>

    <div class="schedule-panel" id="schedulePanel"></div>
  </div>

  <script>
    // GANTI dengan URL Web App Apps Script kamu (harus diakhiri /exec)
    var WEB_APP_URL = 'GANTI_DENGAN_URL_WEB_APP_KAMU';
    var targetCountdown = null;

    function muatData() {
      document.getElementById('loading').style.display = 'block';
      fetch(WEB_APP_URL + '?format=json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          tampilkanData(data);
          document.getElementById('loading').style.display = 'none';
        })
        .catch(function (err) {
          document.getElementById('loading').innerText = 'Gagal memuat data. Periksa URL Web App.';
          console.error(err);
        });
    }

    function tampilkanData(data) {
      document.getElementById('statusDot').className = 'dot ' + (data.statusSistem ? 'aktif' : 'nonaktif');
      document.getElementById('statusTeks').innerText = data.statusSistem ? 'Sistem berjalan normal' : 'Sistem tidak aktif';

      document.getElementById('waktuUpdate').innerText = data.waktuUpdate;
      document.getElementById('jadwalBerikutnya').innerText = data.jadwalBerikutnyaTeks;

      if (data.jadwalBerikutnyaWaktu) {
        var now = new Date();
        var jm = data.jadwalBerikutnyaWaktu.split(':');
        targetCountdown = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(jm[0], 10), parseInt(jm[1], 10), 0);
      } else {
        targetCountdown = null;
        document.getElementById('countdown').innerText = '';
      }

      document.getElementById('cards').innerHTML =
        buatKartu('Total Naskah', data.total) +
        buatKartu('Sudah Posting', data.posted) +
        buatKartu('Belum Posting', data.pending) +
        buatKartu('Error', data.error) +
        buatKartu('Tingkat Keberhasilan', data.successRate + '%');

      var tbody = document.getElementById('tabelBody');
      tbody.innerHTML = '';
      data.rows.forEach(function (row) {
        var statusTampil;
        if (row.status === 'Posted' && row.link) {
          statusTampil = '<a href="' + row.link + '" target="_blank" class="link-posted">Posted</a>';
        } else if (row.status.indexOf('Error') === 0) {
          statusTampil = '<span class="status-error">' + row.status + '</span>';
        } else {
          statusTampil = '<span class="status-pending">' + row.status + '</span>';
        }
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + row.judul + '</td>' +
          '<td>' + row.lokasi + '</td>' +
          '<td>' + row.jadwal + '</td>' +
          '<td>' + statusTampil + '</td>';
        tbody.appendChild(tr);
      });

      var schedulePanel = document.getElementById('schedulePanel');
      schedulePanel.innerHTML = '';
      data.jadwalList.forEach(function (item) {
        var icon = item.selesai ? '<span class="cek">✔</span>' : '<span class="jam-icon">⏳</span>';
        var div = document.createElement('div');
        div.className = 'schedule-item';
        div.innerHTML = '<div><span class="waktu">' + item.jam + '</span> - ' + item.judul + '</div>' + icon;
        schedulePanel.appendChild(div);
      });
    }

    function buatKartu(label, nilai) {
      return '<div class="card"><h2>' + nilai + '</h2><p>' + label + '</p></div>';
    }

    function perbaruiJam() {
      var now = new Date();
      document.getElementById('jamSekarang').innerText = now.toLocaleTimeString('id-ID');

      var opsiMasehi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      var tanggalMasehi = now.toLocaleDateString('id-ID', opsiMasehi);

      var tanggalHijri = '';
      try {
        tanggalHijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' }).format(now) + ' H';
      } catch (e) {}

      document.getElementById('tanggalHijriMasehi').innerText = tanggalMasehi + (tanggalHijri ? ' | ' + tanggalHijri : '');

      if (targetCountdown) {
        var selisih = targetCountdown - now;
        if (selisih > 0) {
          var jam = Math.floor(selisih / 3600000);
          var menit = Math.floor((selisih % 3600000) / 60000);
          var detik = Math.floor((selisih % 60000) / 1000);
          var teks = (jam < 10 ? '0' : '') + jam + ':' + (menit < 10 ? '0' : '') + menit + ':' + (detik < 10 ? '0' : '') + detik;
          document.getElementById('countdown').innerText = '(' + teks + ')';
        } else {
          document.getElementById('countdown').innerText = '';
        }
      }
    }

    muatData();
    setInterval(muatData, 15000);
    setInterval(perbaruiJam, 1000);
    perbaruiJam();
  </script>
</body>
</html>
