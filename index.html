<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Posting Otomatis (Backup)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #2c3e50;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    min-width: 140px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .card h2 {
    margin: 0;
    font-size: 22px;
  }
  .card p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #7f8c8d;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
    text-align: left;
  }
  th {
    background: #2c3e50;
    color: #fff;
  }
  .status-posted { color: #27ae60; font-weight: bold; }
  .status-error { color: #e74c3c; font-weight: bold; }
  .status-pending { color: #f39c12; font-weight: bold; }
  .info {
    text-align: center;
    font-size: 12px;
    color: #7f8c8d;
    margin-bottom: 16px;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #7f8c8d;
  }
</style>
</head>
<body>

<h1>Dashboard Posting Otomatis (Backup GitHub)</h1>
<div class="info" id="waktuUpdate">Memuat data...</div>

<div id="loading" class="loading">Sedang mengambil data...</div>

<div id="dashboardContent" style="display:none;">
  <div class="cards">
    <div class="card"><h2 id="total">0</h2><p>Total Naskah</p></div>
    <div class="card"><h2 id="posted">0</h2><p>Sudah Posting</p></div>
    <div class="card"><h2 id="pending">0</h2><p>Belum Posting</p></div>
    <div class="card"><h2 id="error">0</h2><p>Error</p></div>
    <div class="card"><h2 id="successRate">0%</h2><p>Tingkat Keberhasilan</p></div>
  </div>

  <p style="text-align:center;">Jadwal Berikutnya: <strong id="jadwalBerikutnya">-</strong></p>

  <table>
    <thead>
      <tr>
        <th>Judul</th>
        <th>Lokasi</th>
        <th>Jadwal</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tabelRows"></tbody>
  </table>
</div>

<script>
  // Ganti URL di bawah ini dengan URL Web App Apps Script kamu (diakhiri /exec)
  var URL_API = 'https://script.google.com/macros/s/AKfycbxvQZnr4Lp1Tq4mjahvsAbW7VXvz4kCQx6H7u43tVJatujFoS-caxNBWTAGmk_Aecv_AA/exec?format=json';

  fetch(URL_API)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';

      document.getElementById('waktuUpdate').innerText = 'Terakhir diperbarui: ' + data.waktuUpdate;
      document.getElementById('total').innerText = data.total;
      document.getElementById('posted').innerText = data.posted;
      document.getElementById('pending').innerText = data.pending;
      document.getElementById('error').innerText = data.error;
      document.getElementById('successRate').innerText = data.successRate + '%';
      document.getElementById('jadwalBerikutnya').innerText = data.jadwalBerikutnya;

      var tbody = document.getElementById('tabelRows');
      data.rows.forEach(function (row) {
        var kelasStatus = 'status-pending';
        if (row.status === 'Posted') kelasStatus = 'status-posted';
        else if (row.status.indexOf('Error') === 0) kelasStatus = 'status-error';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + row.judul + '</td>' +
          '<td>' + row.lokasi + '</td>' +
          '<td>' + row.jadwal + '</td>' +
          '<td class="' + kelasStatus + '">' + row.status + '</td>';
        tbody.appendChild(tr);
      });
    })
    .catch(function (err) {
      document.getElementById('loading').innerText = 'Gagal memuat data. Pastikan URL Web App sudah benar dan dapat diakses publik.';
      console.error(err);
    });
</script>

</body>
</html>
