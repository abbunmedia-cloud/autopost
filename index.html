<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Posting Otomatis</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #2c3e50; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 20px; }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; min-width: 140px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h2 { margin: 0; font-size: 24px; }
    .card p { margin: 4px 0 0; font-size: 13px; color: #7f8c8d; }
    .info { text-align: center; font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #ecf0f1; }
    th { background: #2c3e50; color: #fff; }
    tr:hover { background: #f9fbfd; }
    a.link-posted { color: #27ae60; font-weight: 600; text-decoration: underline; }
    .status-error { color: #e74c3c; font-weight: 600; }
    .status-pending { color: #7f8c8d; }
    .refresh-btn { display: block; margin: 0 auto 20px; padding: 8px 16px; background: #2c3e50; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .refresh-btn:hover { background: #34495e; }
    .loading { text-align: center; color: #7f8c8d; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Dashboard Posting Otomatis</h1>
  <button class="refresh-btn" onclick="muatData()">Perbarui Data</button>

  <div class="cards" id="cards"></div>
  <div class="info" id="info"></div>
  <div class="loading" id="loading">Memuat data...</div>

  <table>
    <thead>
      <tr>
        <th>Judul</th>
        <th>Lokasi</th>
        <th>Jadwal</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tabelBody"></tbody>
  </table>

  <script>
    // Ganti URL di bawah ini dengan URL Web App Apps Script kamu
    var WEB_APP_URL = 'GANTI_DENGAN_URL_WEB_APP_KAMU';

    function muatData() {
      document.getElementById('loading').style.display = 'block';
      fetch(WEB_APP_URL + '?format=json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          tampilkanData(data);
          document.getElementById('loading').style.display = 'none';
        })
        .catch(function (err) {
          document.getElementById('loading').innerText = 'Gagal memuat data.';
          console.error(err);
        });
    }

    function tampilkanData(data) {
      document.getElementById('cards').innerHTML =
        buatKartu('Total Naskah', data.total) +
        buatKartu('Sudah Posting', data.posted) +
        buatKartu('Error', data.error) +
        buatKartu('Belum Posting', data.pending) +
        buatKartu('Tingkat Berhasil', data.successRate + '%');

      document.getElementById('info').innerText =
        'Sistem: ' + (data.statusSistem ? 'Aktif' : 'Tidak Aktif') +
        ' | Update: ' + data.waktuUpdate +
        ' | Jadwal Berikutnya: ' + data.jadwalBerikutnya;

      var tbody = document.getElementById('tabelBody');
      tbody.innerHTML = '';

      data.rows.forEach(function (row) {
        var statusTampil;
        if (row.status === 'Posted' && row.link) {
          statusTampil = '<a href="' + row.link + '" target="_blank" class="link-posted">Posted</a>';
        } else if (row.status.indexOf('Error') === 0) {
          statusTampil = '<span class="status-error">' + row.status + '</span>';
        } else {
          statusTampil = '<span class="status-pending">' + row.status + '</span>';
        }

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + row.judul + '</td>' +
          '<td>' + row.lokasi + '</td>' +
          '<td>' + row.jadwal + '</td>' +
          '<td>' + statusTampil + '</td>';
        tbody.appendChild(tr);
      });
    }

    function buatKartu(label, nilai) {
      return '<div class="card"><h2>' + nilai + '</h2><p>' + label + '</p></div>';
    }

    muatData();
    setInterval(muatData, 60000);
  </script>
</body>
</html>
